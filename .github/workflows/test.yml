name: UI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to use'
        required: false
        default: 'chrome'
      execution:
        description: 'Execution mode (local/remote)'
        required: false
        default: 'local'
      config-file:
        description: 'Path to config file'
        required: false
        default: 'config/default.yaml'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        config: [chrome-local, firefox-remote, edge-headless]   # матриця для паралельного запуску
        # або інші комбінації: browser + execution + environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4  # кешує Gradle, dependencies тощо

      - name: Run tests with config
          #env:
          # Базові env vars (можна override в матриці або secrets)
          # TEST_BROWSER: ${{ matrix.browser || 'chrome' }}
          # TEST_EXECUTION: ${{ matrix.execution || 'local' }}
          # CONFIG_FILE: config/${{ matrix.config }}.yaml   # різні файли для різних сценаріїв
        env:
          TEST_BROWSER: ${{ inputs.browser }}
          TEST_EXECUTION: ${{ inputs.execution }}
          CONFIG_FILE: ${{ inputs.config-file }}
        run: |
          ./gradlew test \
            -Ptest.browser=${{ env.TEST_BROWSER }} \
            -Ptest.execution=${{ env.TEST_EXECUTION }} \
            -PconfigFile=${{ env.CONFIG_FILE }} \
            --info   # або --stacktrace для дебагу

      - name: Upload test results (Allure, screenshots тощо)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.config }}
          path: build/reports/tests/test/